name: Unified Automation Framework CI

permissions:
  contents: read
  pages: write
  id-token: write

# =========================================
# Workflow Triggers
# =========================================

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

  workflow_dispatch:

  # Nightly Regression Execution
  schedule:
    - cron: '30 18 * * *'

jobs:

  # =========================================
  # Smoke Suite Execution
  # Runs on Push and Pull Requests
  # =========================================

  build:

    if: github.event_name != 'schedule'

    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Maven Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-m2

    - name: Verify Maven Installation
      run: mvn -version

    - name: Clean Project
      run: mvn clean

    - name: Compile Framework
      run: mvn compile

    - name: Run Smoke Suite
      run: mvn test -DsuiteXmlFile=src/test/resources/testng-smoke.xml -Dbrowser=chrome -Dheadless=true

    - name: Upload Surefire Reports
      uses: actions/upload-artifact@v4
      with:
        name: Surefire-Reports
        path: target/surefire-reports/

    - name: Upload Smoke Reports
      uses: actions/upload-artifact@v4
      with:
        name: Smoke-TestNG-Reports
        path: test-output/

    - name: Setup GitHub Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: test-output/

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  # =========================================
  # Nightly Regression Execution
  # Scheduled Daily at 12:00 AM IST
  # =========================================

  nightly-regression:

    if: github.event_name == 'schedule'

    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Maven Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-m2

    - name: Verify Maven Installation
      run: mvn -version

    - name: Clean Project
      run: mvn clean

    - name: Compile Framework
      run: mvn compile

    - name: Run Regression Suite
      run: mvn test -DsuiteXmlFile=src/test/resources/testng-regression.xml -Dbrowser=chrome -Dheadless=true

    - name: Upload Surefire Reports
      uses: actions/upload-artifact@v4
      with:
        name: Regression-Surefire-Reports
        path: target/surefire-reports/

    - name: Upload Regression Reports
      uses: actions/upload-artifact@v4
      with:
        name: Regression-TestNG-Reports
        path: test-output/

    - name: Zip Regression Reports
      run: zip -r regression-report.zip test-output/

    - name: Send Email Notification
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: Nightly Regression Execution Report
        body: |
          Hello,

          Nightly regression execution has completed successfully.

          Please find the attached automation execution report.

          Repository:
          https://github.com/sumit-qa-automation/unified-automation-framework

          Regards,
          GitHub Actions CI/CD

        to: sumight25@gmail.com
        from: GitHub Actions
        secure: true
        attachments: regression-report.zip

    - name: Setup GitHub Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: test-output/

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  # =========================================
  # Manual Mobile Automation Execution
  # Triggered using workflow_dispatch
  # =========================================

  mobile-automation:

    if: github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    env:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Maven Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-m2

    - name: Verify Maven Installation
      run: mvn -version

    - name: Clean Project
      run: mvn clean

    - name: Compile Framework
      run: mvn compile

    - name: Run Mobile Automation Suite
      run: mvn clean test -DsuiteXmlFile=src/test/resources/testng-mobile.xml

    - name: Upload Mobile Reports
      uses: actions/upload-artifact@v4
      with:
        name: Mobile-Test-Reports
        path: test-output/
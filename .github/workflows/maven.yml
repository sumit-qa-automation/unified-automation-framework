name: Unified Automation Framework CI

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

  # Nightly regression execution schedule
  schedule:
    - cron: '30 18 * * *'

  # Manual workflow trigger with suite selection
  workflow_dispatch:
    inputs:
      suite:
        description: "Select automation suite to execute"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - regression
          - mobile

jobs:

  smoke-suite:

    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event.inputs.suite == 'smoke'

    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Maven Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-m2

    - name: Verify Maven Installation
      run: mvn -version

    - name: Clean Project
      run: mvn clean

    - name: Compile Framework
      run: mvn compile

    - name: Run Smoke Suite
      run: mvn test -DsuiteXmlFile=src/test/resources/testng-smoke.xml -Dbrowser=chrome -Dheadless=true

    - name: Upload Surefire Reports
      uses: actions/upload-artifact@v4
      with:
        name: Surefire-Reports
        path: target/surefire-reports/

    - name: Upload Smoke Reports
      uses: actions/upload-artifact@v4
      with:
        name: Smoke-TestNG-Reports
        path: test-output/

    - name: Prepare GitHub Pages Report
      run: cp test-output/ExtentReport.html test-output/index.html

    - name: Setup GitHub Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: test-output/

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  regression-suite:

    if: github.event_name == 'schedule' || github.event.inputs.suite == 'regression'

    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Maven Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-m2

    - name: Verify Maven Installation
      run: mvn -version

    - name: Clean Project
      run: mvn clean

    - name: Compile Framework
      run: mvn compile

    - name: Run Regression Suite
      run: mvn test -DsuiteXmlFile=src/test/resources/testng-regression.xml -Dbrowser=chrome -Dheadless=true

    - name: Upload Surefire Reports
      uses: actions/upload-artifact@v4
      with:
        name: Regression-Surefire-Reports
        path: target/surefire-reports/

    - name: Upload Regression Reports
      uses: actions/upload-artifact@v4
      with:
        name: Regression-TestNG-Reports
        path: test-output/

    - name: Prepare Extent Report Attachment
      run: cp test-output/ExtentReport.html ExtentReport.html

    - name: Send Email Notification
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: Regression Suite Execution Report
        body: |
          Hello,

          Regression suite execution has completed successfully.

          GitHub Pages Report:
          https://sumit-qa-automation.github.io/unified-automation-framework/

          Repository:
          https://github.com/sumit-qa-automation/unified-automation-framework

          Attached:
          ExtentReport.html

          Regards,
          GitHub Actions CI/CD

        to: sumitght25@gmail.com
        from: GitHub Actions
        secure: true
        attachments: ExtentReport.html

    - name: Prepare GitHub Pages Report
      run: cp test-output/ExtentReport.html test-output/index.html

    - name: Setup GitHub Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: test-output/

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  mobile-automation:

    if: github.event.inputs.suite == 'mobile'

    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Maven Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-m2

    - name: Verify Maven Installation
      run: mvn -version

    - name: Clean Project
      run: mvn clean

    - name: Compile Framework
      run: mvn compile

    - name: Run Mobile Automation Suite
      run: mvn test -DsuiteXmlFile=src/test/resources/testng-mobile.xml

    - name: Upload Mobile Reports
      uses: actions/upload-artifact@v4
      with:
        name: Mobile-TestNG-Reports
        path: test-output/

    - name: Prepare Mobile Report Attachment
      run: cp test-output/ExtentReport.html MobileExtentReport.html

    - name: Send Mobile Execution Email
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: Mobile Automation Execution Report
        body: |
          Hello,

          Mobile automation execution has completed successfully.

          GitHub Pages Report:
          https://sumit-qa-automation.github.io/unified-automation-framework/

          Repository:
          https://github.com/sumit-qa-automation/unified-automation-framework

          Attached:
          MobileExtentReport.html

          Regards,
          GitHub Actions CI/CD

        to: sumitght25@gmail.com
        from: GitHub Actions
        secure: true
        attachments: MobileExtentReport.html

    - name: Prepare GitHub Pages Report
      run: cp test-output/ExtentReport.html test-output/index.html

    - name: Setup GitHub Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: test-output/

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4